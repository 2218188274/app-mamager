name: ChatQ iPhone device archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/chatq_keyboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/chatq_keyboard/package-lock.json
      - run: npm ci
      - name: Compile and validate the real iPhone host and keyboard
        run: bash scripts/archive-ios.sh unsigned
        env:
          CHATQ_IOS_DEVICE_BUILD_DIR: ${{ runner.temp }}/chatq-ios-device
      - uses: actions/upload-artifact@v4
        with:
          name: ChatQ-iPhone-device-UNSIGNED-NOT-INSTALLABLE
          path: |
            ${{ runner.temp }}/chatq-ios-device/ChatQ-ios-device-unsigned.zip
            ${{ runner.temp }}/chatq-ios-device/device-build.json
          retention-days: 14
