name: ChatQ Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/chatq_windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core and synthetic network checks
        run: python tests/run-fixture.py
      - name: Build and test x64 native input method
        run: |
          cmake -S native -B out/native-x64 -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/native-x64 --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir out/native-x64 -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and test x86 native input method
        run: |
          cmake -S native -B out/native-x86 -A Win32
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/native-x86 --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir out/native-x86 -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package desktop assistant and installer
        run: |
          dotnet publish Desktop/ChatQ.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/assistant
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out/x64,out/x86 | Out-Null
          Copy-Item out/native-x64/Release/ChatQTip.dll,out/native-x64/Release/dict_pinyin.dat out/x64/
          Copy-Item out/native-x86/Release/ChatQTip.dll,out/native-x86/Release/dict_pinyin.dat out/x86/
          Copy-Item README.md out/assistant/
          Compress-Archive -Path out/assistant/* -DestinationPath out/ChatQ-Windows-0.1.0-x64-Portable.zip
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" installer/ChatQ.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ChatQ-Windows-0.1.0-preview
          path: |
            apps/chatq_windows/out/*Setup.exe
            apps/chatq_windows/out/*Portable.zip
            apps/chatq_windows/out/x64/
            apps/chatq_windows/out/x86/
          retention-days: 14
