# Use after deploy/compose.yaml. Paths resolve against that first Compose file.
services:
  api:
    image: chatq-api:free-personal-1.25.0
    environment:
      CORS_ORIGIN: http://103.149.91.78,https://103.149.91.78,https://lt.youling.lol
      CHATQ_PERSONAL_API_APP_IDS: ${CHATQ_PERSONAL_API_APP_IDS:-}
      CHATQ_DISABLE_APPLE_WEBHOOK: 'true'
      CHATQ_SPEECH_URL: http://whisper:8080/inference
      CHATQ_SPEECH_MODEL: whisper-base
      CHATQ_LEXICON_FILE: /input-data/cloud-lexicon.tsv
      CHATQ_PAYMENT_CONFIG_FILE: /payment-private/payments.json
      CHATQ_PAYMENT_ADMIN_WRITE: 'true'
      # The API is bound to loopback; Caddy overwrites this forwarded header.
      CHATQ_PAYMENT_TRUST_PROXY: 'true'
    volumes:
      - ../server/data/input:/input-data:ro
      # Provision as uid/gid 1000, mode 0700. Merchant files are mode 0600.
      - /mnt/chatq-data/chatq/payment-private:/payment-private:rw
  whisper:
    image: chatq-whisper:1.4.0
    build:
      context: ..
      dockerfile: server/deploy/Whisper.Dockerfile
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-base-q5_1.bin", "-t", "3", "-bs", "1", "-bo", "1", "-l", "auto", "-nt", "-nf"]
    volumes:
      - /opt/chatq/speech-models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 3.0
    logging:
      driver: none
